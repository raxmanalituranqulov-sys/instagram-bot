services:
  - type: web
    name: instagram-bot
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_COOKIES
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
